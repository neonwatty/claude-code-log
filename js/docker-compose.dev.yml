version: '3.8'

services:
  app:
    build:
      target: development
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/node_modules
      - /app/frontend/node_modules
      - /app/shared/node_modules
    ports:
      - "3001:3001"  # Backend
      - "5173:5173"  # Frontend dev server
    command: ["dumb-init", "npm", "run", "dev"]

  # Remove production services in development
  nginx:
    profiles: ["production"]
  
  prometheus:
    profiles: ["production"]
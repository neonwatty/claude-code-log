<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Code Log - TypeScript</title>
    <meta
      name="description"
      content="TypeScript full-stack application for converting Claude Code transcript JSONL files into readable HTML format"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell',
          sans-serif;
        background-color: #f5f5f5;
      }

      #app {
        min-height: 100vh;
      }

      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-size: 1.2rem;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="loading">Loading Claude Code Log...</div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

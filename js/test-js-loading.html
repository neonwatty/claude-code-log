<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Loading Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f0f9ff; }
        .status { padding: 15px; margin: 10px 0; border-radius: 8px; }
        .success { background: #f0fdf4; border: 1px solid #10b981; color: #065f46; }
        .error { background: #fef2f2; border: 1px solid #ef4444; color: #991b1b; }
    </style>
</head>
<body>
    <h1>🧪 JavaScript Module Loading Test</h1>
    <div id="status" class="status">Testing JavaScript module loading...</div>
    <div id="results"></div>

    <script type="module">
        const statusEl = document.getElementById('status');
        const resultsEl = document.getElementById('results');
        
        async function testModuleLoading() {
            try {
                statusEl.textContent = '📦 Testing basic ES modules...';
                
                // Test 1: Basic Lit import
                const { html, css } = await import('http://localhost:5173/node_modules/lit/index.js');
                resultsEl.innerHTML += '<div class="status success">✅ Lit library loads successfully</div>';
                
                // Test 2: Try to import the app module
                statusEl.textContent = '🎯 Testing app module import...';
                await import('http://localhost:5173/src/app.ts');
                resultsEl.innerHTML += '<div class="status success">✅ App module imports successfully</div>';
                
                // Test 3: Check if custom element is registered
                statusEl.textContent = '🔍 Checking custom element registration...';
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                const appElement = customElements.get('app-main');
                if (appElement) {
                    resultsEl.innerHTML += '<div class="status success">✅ app-main custom element registered</div>';
                } else {
                    resultsEl.innerHTML += '<div class="status error">❌ app-main custom element not registered</div>';
                }
                
                // Test 4: Try to create the component
                statusEl.textContent = '🏗️ Testing component creation...';
                const app = document.createElement('app-main');
                document.body.appendChild(app);
                
                await new Promise(resolve => setTimeout(resolve, 2000));
                resultsEl.innerHTML += '<div class="status success">✅ App component created and added to DOM</div>';
                
                statusEl.textContent = '✅ All tests completed - app should be working!';
                statusEl.className = 'status success';
                
            } catch (error) {
                console.error('Module loading error:', error);
                resultsEl.innerHTML += `<div class="status error">❌ Error: ${error.message}</div>`;
                statusEl.textContent = `❌ Module loading failed: ${error.message}`;
                statusEl.className = 'status error';
            }
        }
        
        testModuleLoading();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Session Loading</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f0f9ff; }
        .debug-box { background: white; padding: 20px; margin: 10px 0; border-radius: 8px; border: 1px solid #e2e8f0; }
        .error { color: red; background: #fef2f2; border-color: #fecaca; }
        .success { color: green; background: #f0fdf4; border-color: #bbf7d0; }
        pre { background: #f8fafc; padding: 10px; border-radius: 4px; overflow: auto; }
    </style>
</head>
<body>
    <h1>🔍 Debug Session Loading</h1>
    
    <div class="debug-box">
        <h3>API Test Result</h3>
        <div id="api-result">Testing API connection...</div>
    </div>
    
    <div class="debug-box">
        <h3>Frontend Application Status</h3>
        <div id="frontend-result">Checking frontend...</div>
    </div>
    
    <div class="debug-box">
        <h3>Session Data</h3>
        <div id="session-data">Loading session data...</div>
    </div>

    <script>
        async function testAPI() {
            try {
                console.log('🚀 Testing API endpoint...');
                const response = await fetch('http://localhost:3001/api/sessions?limit=5');
                const data = await response.json();
                
                document.getElementById('api-result').innerHTML = `
                    <div class="success">✅ API Working!</div>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                
                // Test session data
                if (data.success && data.data?.sessions) {
                    const sessions = data.data.sessions;
                    document.getElementById('session-data').innerHTML = `
                        <div class="success">📊 Found ${sessions.length} sessions</div>
                        <h4>Session Summary:</h4>
                        <ul>
                            ${sessions.map(session => `
                                <li><strong>ID:</strong> ${session.id.substring(0, 12)}... 
                                    <strong>Messages:</strong> ${session.entries.length}
                                    <strong>Tokens:</strong> ${session.totalUsage.input_tokens + session.totalUsage.output_tokens}</li>
                            `).join('')}
                        </ul>
                    `;
                }
            } catch (error) {
                console.error('❌ API Error:', error);
                document.getElementById('api-result').innerHTML = `
                    <div class="error">❌ API Failed: ${error.message}</div>
                `;
            }
        }

        async function testFrontend() {
            try {
                console.log('🖥️ Testing frontend connection...');
                const response = await fetch('http://localhost:5173/');
                
                if (response.ok) {
                    document.getElementById('frontend-result').innerHTML = `
                        <div class="success">✅ Frontend server is running on port 5173</div>
                        <p>Frontend is accessible and serving content.</p>
                    `;
                } else {
                    throw new Error(`Frontend returned status ${response.status}`);
                }
            } catch (error) {
                console.error('❌ Frontend Error:', error);
                document.getElementById('frontend-result').innerHTML = `
                    <div class="error">❌ Frontend Failed: ${error.message}</div>
                `;
            }
        }

        // Run tests
        window.addEventListener('load', () => {
            testAPI();
            testFrontend();
        });
    </script>
</body>
</html>
